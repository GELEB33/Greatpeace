<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Королевство: Эпическая Песочница</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes glow {
            0% { box-shadow: 0 0 5px rgba(255,215,0,0.5); }
            100% { box-shadow: 0 0 20px rgba(255,215,0,0.8); }
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        body {
            background: linear-gradient(135deg, #0a0f1a 0%, #0f1a2a 50%, #0a0f1a 100%);
            font-family: 'Segoe UI', 'MedievalSharp', 'Georgia', serif;
            padding: 12px;
            padding-bottom: 85px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(100,50,20,0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .game-wrapper {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(30, 25, 45, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 48px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
            overflow: hidden;
            padding: 18px;
            border: 1px solid rgba(255,215,0,0.2);
            position: relative;
            z-index: 1;
        }

        .kingdom-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .kingdom-name-input {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,215,0,0.5);
            padding: 8px 16px;
            border-radius: 40px;
            color: #ffefcf;
            font-weight: bold;
            font-size: 1rem;
            width: 180px;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .turn-counter {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            padding: 6px 14px;
            border-radius: 40px;
            color: #ffd966;
            font-size: 0.8rem;
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .pause-btn {
            background: #5a3a1a;
            border: none;
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pause-btn:active { transform: scale(0.95); }

        .resources-scroll {
            overflow-x: auto;
            white-space: nowrap;
            margin-bottom: 16px;
            padding-bottom: 8px;
        }

        .resources-flex {
            display: inline-flex;
            gap: 10px;
        }

        .res-card {
            background: linear-gradient(135deg, rgba(0,0,0,0.7), rgba(30,20,40,0.8));
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #ffefcf;
            font-weight: bold;
            font-size: 0.85rem;
            border: 1px solid rgba(255,215,0,0.3);
            transition: all 0.2s;
            animation: float 3s ease-in-out infinite;
        }

        .res-card span:first-child { font-size: 1.3rem; }

        .quick-stats {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.7rem;
            border: 1px solid rgba(255,215,0,0.2);
        }

        .stat-badge {
            background: rgba(255,215,0,0.15);
            border-radius: 30px;
            padding: 4px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10,15,25,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 10px 12px 20px;
            border-top: 1px solid rgba(255,215,0,0.3);
            z-index: 100;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 32px 32px 0 0;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: linear-gradient(135deg, #4a3020, #2a1a0a);
            border: none;
            color: #ffe2b5;
            font-size: 0.55rem;
            padding: 8px 6px;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            min-width: 55px;
            margin: 2px;
            transition: all 0.1s;
            box-shadow: 0 4px 0 #1a0a00;
        }

        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1a0a00;
        }

        .nav-btn span:first-child { font-size: 1.3rem; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-card {
            background: linear-gradient(135deg, #2a2030, #1a1020);
            max-width: 500px;
            width: 100%;
            max-height: 85vh;
            border-radius: 48px;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid rgba(255,215,0,0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .modal-card h3 {
            font-size: 1.5rem;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffd966, #ffaa33);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            border-left: 4px solid #ffaa33;
            padding-left: 16px;
        }

        .close-modal {
            background: #8a3a2a;
            float: right;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .close-modal:active { transform: scale(0.95); }

        .action-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
        }

        .action-btn {
            background: linear-gradient(135deg, #3a2a1a, #2a1a0a);
            border: none;
            padding: 12px 16px;
            border-radius: 60px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            cursor: pointer;
            color: #ffefcf;
            transition: all 0.1s;
            box-shadow: 0 3px 0 #1a0a00;
        }

        .action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1a0a00;
        }

        .event-log {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 12px;
            color: #fbeccd;
            font-size: 0.7rem;
            max-height: 150px;
            overflow-y: auto;
            margin-top: 16px;
            border: 1px solid rgba(255,215,0,0.2);
        }

        .event-log p {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,215,0,0.1);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,215,0,0.2);
            font-size: 0.85rem;
        }

        .progress {
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            height: 8px;
            margin: 10px 0;
        }

        .progress-fill {
            background: linear-gradient(90deg, #ffaa33, #ffd966);
            width: 50%;
            height: 8px;
            border-radius: 20px;
            transition: width 0.3s;
        }

        .achievement {
            background: linear-gradient(135deg, #2a5a2a, #1a3a1a);
            border-radius: 20px;
            padding: 6px 12px;
            margin: 5px 0;
            color: #ffefcf;
            font-size: 0.7rem;
            border: 1px solid #ffd966;
        }

        .crisis-warning {
            background: linear-gradient(135deg, #8a2a2a, #5a1a1a);
            color: white;
            padding: 10px;
            border-radius: 20px;
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
            animation: pulse 1s infinite;
        }

        footer {
            font-size: 0.5rem;
            text-align: center;
            margin-top: 16px;
            color: rgba(255,235,200,0.5);
        }

        @keyframes resourceGain {
            0% { transform: scale(1); color: #ffefcf; }
            50% { transform: scale(1.1); color: #4cff4c; }
            100% { transform: scale(1); color: #ffefcf; }
        }

        .gain-animation {
            animation: resourceGain 0.3s ease;
        }

        .loss-animation {
            animation: resourceGain 0.3s ease reverse;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="kingdom-header">
        <input type="text" id="kingdomNameInput" class="kingdom-name-input" value="Северный Престол" maxlength="25">
        <div class="turn-counter">📅 Ход: <span id="turnCount">0</span> <button id="pauseGameBtn" class="pause-btn">⏸️</button></div>
    </div>
    <div class="resources-scroll">
        <div class="resources-flex" id="resPanel"></div>
    </div>
    <div class="quick-stats" id="quickStats"></div>
    <div id="crisisPanel"></div>
    <div id="achievementsPanel" style="margin-top:8px;"></div>
    <div class="event-log" id="eventLog"><p>🏰 Добро пожаловать в королевство, повелитель!</p></div>
    <footer>⚔️ Управляй королевством | 📦 Торгуй | 📜 Принимай законы | 🔬 Исследуй технологии</footer>
</div>

<div class="bottom-nav">
    <button class="nav-btn" data-modal="economyModal"><span>🏭</span><span>Ресурсы</span></button>
    <button class="nav-btn" data-modal="tradeModal"><span>📦</span><span>Торговля</span></button>
    <button class="nav-btn" data-modal="lawsModal"><span>📜</span><span>Законы</span></button>
    <button class="nav-btn" data-modal="buildingsModal"><span>🏛️</span><span>Здания</span></button>
    <button class="nav-btn" data-modal="techModal"><span>📚</span><span>Технологии</span></button>
    <button class="nav-btn" data-modal="infoModal"><span>📊</span><span>Статистика</span></button>
</div>

<!-- МОДАЛЬНЫЕ ОКНА -->
<div id="economyModal" class="modal"><div class="modal-card"><button class="close-modal">✖️</button><h3>🏭 Ресурсы и стройка</h3><div class="action-list">
    <button class="action-btn" id="gatherWoodBtn">🪵 Рубить лес (+8-16 дер)</button>
    <button class="action-btn" id="gatherStoneBtn">⛰️ Добыть камень (+5-10 кам)</button>
    <button class="action-btn" id="gatherCoalBtn">🪨 Добыть уголь (+4-8 угля)</button>
    <button class="action-btn" id="gatherIronBtn">⚙️ Добыть железо (+2-5 жел, сложно)</button>
    <button class="action-btn" id="mineMithrilBtn">✨ Добыть мифрил (+0-2 миф, очень сложно)</button>
    <button class="action-btn" id="gatherManaBtn">🔮 Собрать ману (+1-3 маны, редко)</button>
    <button class="action-btn" id="buildFarmBtn">🌾 Построить поле (-35 дер, +1 поле)</button>
    <button class="action-btn" id="buildHouseBtn">🏠 Построить дом (-40 дер, +6 жилья)</button>
    <button class="action-btn" id="buildMineBtn">⛏️ Шахта (-60 дер, -25 кам, +4 жел/ход)</button>
    <button class="action-btn" id="expandLandBtn">🗺️ Освоить земли (-30 дер, +120 площ, +1 поле)</button>
</div>
<div class="progress"><div class="progress-fill" id="woodDepletionFill"></div></div>
<div id="resourceStatus"></div>
</div></div>

<div id="buildingsModal" class="modal"><div class="modal-card"><button class="close-modal">✖️</button><h3>🏛️ Специальные здания</h3><div class="action-list">
    <button class="action-btn" id="buildMarketBtn">📊 Рынок (-80 дер, -40 кам, +6 золота/ход, +10% торговли)</button>
    <button class="action-btn" id="buildTavernBtn">🍺 Таверна (-60 дер, -20 кам, +5 счастья/ход, тратит 8 еды)</button>
    <button class="action-btn" id="buildForgeBtn">⚔️ Кузница (-100 дер, -50 жел, +20% к добыче ресурсов)</button>
    <button class="action-btn" id="buildGuildBtn">🔮 Гильдия магов (-150 дер, -80 кам, -30 миф, +10 науки/ход)</button>
    <button class="action-btn" id="buildObservatoryBtn">🔭 Обсерватория (-70 дер, -35 кам, +6 науки/ход)</button>
</div></div></div>

<div id="tradeModal" class="modal"><div class="modal-card"><button class="close-modal">✖️</button><h3>📦 Торговля</h3><div class="action-list">
    <button class="action-btn" id="sellWoodTrade">🪵 Продать 20 дер → +24-30 зол</button>
    <button class="action-btn" id="sellStoneTrade">⛰️ Продать 15 кам → +28 зол</button>
    <button class="action-btn" id="sellCoalTrade">🪨 Продать 15 угля → +25 зол</button>
    <button class="action-btn" id="sellIronTrade">⚙️ Продать 10 железа → +40 зол</button>
    <button class="action-btn" id="sellGemTrade">💎 Продать драгоценность → +60 зол</button>
    <button class="action-btn" id="buyFoodTrade">🍞 Купить 30 еды → -25 зол</button>
    <button class="action-btn" id="investTradeBtn">📈 Инвестиции (-50 зол, +4 зол/ход)</button>
</div>
<div id="tradeReputation">🤝 Репутация: 50%</div>
</div></div>

<div id="lawsModal" class="modal"><div class="modal-card"><button class="close-modal">✖️</button><h3>📜 Законы</h3><div class="action-list">
    <button class="action-btn" id="lawBirthBtn">👶 Указ рождаемости (+0.8 рожд, -15 зол)</button>
    <button class="action-btn" id="lawForestBtn">🌳 Лесной указ (+8% восст леса)</button>
    <button class="action-btn" id="lawHarvestBtn">🌽 Севооборот (+10% урожая)</button>
</div>
<div>😊 Счастье: <span id="hapVal">70</span>%</div>
</div></div>

<div id="techModal" class="modal"><div class="modal-card"><button class="close-modal">✖️</button><h3>📚 Технологии</h3><div id="techPanel"></div><div>🔬 Очки науки: <span id="sciencePoints">0</span></div></div></div>

<div id="infoModal" class="modal"><div class="modal-card"><button class="close-modal">✖️</button><h3>📊 Статистика</h3><div id="fullStats"></div><button id="resetGameBtn" style="background:#8a3a2a; margin-top:16px;">🔄 Переродить</button><button id="saveGameBtn" style="background:#2a5a2a; margin-top:8px;">💾 Сохранить</button><button id="loadGameBtn" style="background:#2a5a2a; margin-top:4px;">📀 Загрузить</button></div></div>

<script>
    // ЗВУКИ
    const sounds = {
        click: new Audio("data:audio/wav;base64,U3RlYWx0aCBzb3VuZA=="),
        build: new Audio("data:audio/wav;base64,QnVpbGQgc291bmQ="),
        gather: new Audio("data:audio/wav;base64,R2F0aGVyIHNvdW5k"),
        event: new Audio("data:audio/wav;base64,RXZlbnQgc291bmQ="),
        crisis: new Audio("data:audio/wav;base64,Q3Jpc2lzIHNvdW5k"),
        achievement: new Audio("data:audio/wav;base64,QWNoaWV2ZW1lbnQgc291bmQ=")
    };
    function playSound(name) { try { if(sounds[name]) sounds[name].play(); } catch(e) {} }

    // ИГРОВОЕ СОСТОЯНИЕ
    let game = {
        name: "Северный Престол", turn: 0,
        food: 80, wood: 50, stone: 20, coal: 15, gold: 40,
        iron: 5, gems: 0, mithril: 0, mana: 3,
        population: 10, houses: 3, farms: 1, mines: 0, observatories: 0,
        markets: 0, taverns: 0, forges: 0, guilds: 0,
        landArea: 300, forestDensity: 85, conqueredBonus: 0,
        birthBonus: 0, marketIncome: 0, happiness: 70,
        loggingUpgrade: false, miningUpgrade: false, forestRegenBonus: false, harvestLaw: false,
        tradeReputation: 50, science: 0,
        techs: { cropRotation: false, sawmill: false, miningPick: false, tradeRoutes: false, architecture: false, magic: false },
        famineCounter: 0,
        crisis: { active: false, type: "", turnsLeft: 0 },
        achievements: { firstHouse: false, firstFarm: false, firstMine: false, population50: false, science100: false, firstGem: false, firstMithril: false }
    };
    
    let gameActive = true, gamePaused = false, gameInterval = null;
    
    function maxPopulation() { return game.houses * 8 + 25; }
    function addLog(msg, isError = false) {
        const logDiv = document.getElementById('eventLog');
        const p = document.createElement('p');
        p.innerHTML = `📜 ${msg}`;
        if(isError) p.style.color = "#ff8866";
        logDiv.prepend(p);
        if(logDiv.children.length > 12) logDiv.removeChild(logDiv.lastChild);
        if(!isError) playSound('event');
        else playSound('crisis');
    }
    
    function checkAchievements() {
        let newAchiev = false;
        if(game.houses >= 5 && !game.achievements.firstHouse) { game.achievements.firstHouse = true; addLog("🏆 Достижение: 5 домов!"); playSound('achievement'); newAchiev = true; }
        if(game.farms >= 5 && !game.achievements.firstFarm) { game.achievements.firstFarm = true; addLog("🏆 Достижение: 5 полей!"); playSound('achievement'); newAchiev = true; }
        if(game.mines >= 3 && !game.achievements.firstMine) { game.achievements.firstMine = true; addLog("🏆 Достижение: 3 шахты!"); playSound('achievement'); newAchiev = true; }
        if(game.population >= 50 && !game.achievements.population50) { game.achievements.population50 = true; addLog("🏆 Достижение: 50 жителей!"); playSound('achievement'); newAchiev = true; }
        if(game.science >= 100 && !game.achievements.science100) { game.achievements.science100 = true; addLog("🏆 Достижение: 100 науки!"); playSound('achievement'); newAchiev = true; }
        if(game.gems >= 1 && !game.achievements.firstGem) { game.achievements.firstGem = true; addLog("💎 Достижение: Найдены драгоценности!"); playSound('achievement'); newAchiev = true; }
        if(game.mithril >= 1 && !game.achievements.firstMithril) { game.achievements.firstMithril = true; addLog("✨ Достижение: Обнаружен мифрил!"); playSound('achievement'); newAchiev = true; }
        if(newAchiev) updateUI();
    }
    
    // ПРОИЗВОДСТВО
    function calcFoodProduction() {
        let base = game.farms * 1.2;
        if(game.techs.cropRotation || game.harvestLaw) base *= 1.1;
        let happinessMod = 0.6 + (game.happiness/200);
        if(game.famineCounter > 0) { base *= 0.4; game.famineCounter--; }
        if(game.crisis.active && game.crisis.type === "drought") base *= 0.3;
        return Math.floor(base * happinessMod);
    }
    
    function calcWoodProduction() {
        let base = 3 + (game.forestDensity / 20);
        if(game.techs.sawmill || game.loggingUpgrade) base *= 1.25;
        let gained = Math.floor(base);
        game.forestDensity = Math.max(5, game.forestDensity - Math.random() * 3);
        if(game.crisis.active && game.crisis.type === "blight") gained = Math.floor(gained * 0.5);
        return Math.max(2, gained);
    }
    
    function calcStoneProduction() { let base = 2; if(game.mines>0) base += game.mines; if(game.crisis.active && game.crisis.type === "earthquake") base = Math.floor(base*0.5); return base; }
    function calcCoalProduction() { let base = 2; if(game.mines>0) base += game.mines; return base; }
    function calcIronProduction() { let base = game.mines + (Math.random() > 0.7 ? 1 : 0); if(game.forges>0) base = Math.floor(base*1.2); return Math.min(4, base); }
    function calcGemProduction() { if(Math.random() > 0.9) return 1; return 0; }
    function calcMithrilProduction() { if(game.mines>=3 && Math.random() > 0.95) return 1; return 0; }
    function calcManaProduction() { let base = (game.guilds>0 ? 2 : 0) + (Math.random() > 0.85 ? 1 : 0); return base; }
    function calcScienceProduction() { return (game.observatories * 4) + (game.guilds * 5) + (game.techs.magic ? 3 : 0); }
    function regrowForest() { game.forestDensity = Math.min(100, game.forestDensity + (game.forestRegenBonus ? 4 : 2)); }
    
    // КРИЗИСЫ
    function triggerCrisis() {
        if(game.crisis.active || Math.random() > 0.12) return;
        let crises = [
            { name: "⚔️ Вторжение орков", effect: () => { let loss = Math.floor(game.population * 0.2); game.population = Math.max(5, game.population - loss); addLog(`⚔️ ВТОРЖЕНИЕ! Потеряно ${loss} воинов!`, true); }, duration: 3, type: "invasion" },
            { name: "🌞 Великая засуха", effect: () => { addLog(`🌞 ВЕЛИКАЯ ЗАСУХА! Урожайность -70% на 3 хода!`, true); }, duration: 3, type: "drought" },
            { name: "🦠 Чёрная чума", effect: () => { let loss = Math.floor(game.population * 0.15); game.population = Math.max(5, game.population - loss); addLog(`🦠 ЧУМА! Умерло ${loss} человек!`, true); }, duration: 4, type: "plague" },
            { name: "🌑 Тёмное проклятие", effect: () => { game.happiness = Math.max(0, game.happiness-20); addLog(`🌑 ТЁМНОЕ ПРОКЛЯТИЕ! Счастье -20!`, true); }, duration: 2, type: "curse" }
        ];
        let c = crises[Math.floor(Math.random()*crises.length)];
        game.crisis = { active: true, type: c.type, turnsLeft: c.duration };
        c.effect();
        playSound('crisis');
        updateUI();
    }
    
    function updateCrisis() {
        if(game.crisis.active) {
            game.crisis.turnsLeft--;
            if(game.crisis.turnsLeft <= 0) {
                game.crisis.active = false;
                addLog(`✨ Кризис "${game.crisis.type}" завершился!`, false);
            }
        }
        triggerCrisis();
    }
    
    // ХОД
    function gameTick() {
        if(!gameActive || gamePaused) return;
        game.turn++;
        
        game.food += calcFoodProduction();
        game.wood += calcWoodProduction();
        game.stone += calcStoneProduction();
        game.coal += calcCoalProduction();
        game.iron += calcIronProduction();
        game.gems += calcGemProduction();
        game.mithril += calcMithrilProduction();
        game.mana += calcManaProduction();
        game.science += calcScienceProduction();
        game.gold += game.marketIncome;
        
        let consumption = Math.floor(game.population * 0.6);
        if(game.food >= consumption) game.food -= consumption;
        else { let starve = Math.floor((consumption - game.food) / 0.6); game.population = Math.max(3, game.population - starve); game.food = 0; addLog(`💀 Голод! -${starve} жителей`, true); }
        
        let birthRate = 0.02 + (game.birthBonus/100) + (game.happiness/1500);
        if(game.crisis.active && game.crisis.type === "plague") birthRate *= 0.3;
        let births = Math.min(Math.floor(game.population * birthRate), maxPopulation() - game.population);
        if(births > 0) { game.population += births; addLog(`👶 Родилось +${births}`); }
        
        game.happiness = Math.min(100, Math.max(0, game.happiness - 0.2 + (game.food > game.population ? 0.5 : -0.6) + (game.taverns > 0 ? 1 : 0)));
        if(game.happiness < 10) { let loss = Math.floor(game.population * 0.1); game.population = Math.max(3, game.population - loss); game.happiness = 20; addLog(`💀 БУНТ! Потеряно ${loss} человек!`, true); }
        
        regrowForest();
        updateCrisis();
        if(Math.random() < 0.06 && game.famineCounter === 0) game.famineCounter = 1;
        
        game.population = Math.min(maxPopulation(), game.population);
        game.food = Math.max(0, Math.floor(game.food));
        game.wood = Math.max(0, Math.floor(game.wood));
        game.stone = Math.max(0, Math.floor(game.stone));
        game.coal = Math.max(0, Math.floor(game.coal));
        game.gold = Math.max(0, Math.floor(game.gold));
        game.iron = Math.max(0, Math.floor(game.iron));
        game.gems = Math.max(0, Math.floor(game.gems));
        game.mithril = Math.max(0, Math.floor(game.mithril));
        game.mana = Math.max(0, Math.floor(game.mana));
        game.tradeReputation = Math.min(90, Math.max(20, game.tradeReputation + (Math.random() - 0.5) * 1));
        
        checkAchievements();
        updateUI();
        if(game.population <= 2) { addLog("💀 КОРОЛЕВСТВО ПАЛО!", true); clearInterval(gameInterval); gameActive = false; }
    }
    
    // ДЕЙСТВИЯ
    function gatherWood() { let g = 8+Math.floor(Math.random()*9); game.wood+=g; addLog(`🪵 +${g} дер`); playSound('gather'); updateUI(); }
    function gatherStone() { let g = 5+Math.floor(Math.random()*6); game.stone+=g; addLog(`⛰️ +${g} кам`); playSound('gather'); updateUI(); }
    function gatherCoal() { let g = 4+Math.floor(Math.random()*5); game.coal+=g; addLog(`🪨 +${g} угля`); playSound('gather'); updateUI(); }
    function gatherIron() { let g = 2+Math.floor(Math.random()*4); game.iron+=g; addLog(`⚙️ +${g} железа`); playSound('gather'); updateUI(); }
    function mineMithril() { if(Math.random()>0.7) { game.mithril++; addLog(`✨ Найден мифрил! +1`); playSound('achievement'); } else addLog(`❌ Мифрил не найден`,true); updateUI(); }
    function gatherMana() { let g = 1+Math.floor(Math.random()*3); game.mana+=g; addLog(`🔮 +${g} маны`); playSound('gather'); updateUI(); }
    function buildFarm() { if(game.wood>=35) { game.wood-=35; game.farms++; addLog(`🌾 Построено поле!`); playSound('build'); } else addLog(`❌ Нужно 35 дер`,true); updateUI(); }
    function buildHouse() { if(game.wood>=40) { game.wood-=40; game.houses++; addLog(`🏠 Построен дом!`); playSound('build'); } else addLog(`❌ Нужно 40 дер`,true); updateUI(); }
    function buildMine() { if(game.wood>=60 && game.stone>=25) { game.wood-=60; game.stone-=25; game.mines++; addLog(`⛏️ Шахта построена!`); playSound('build'); } else addLog(`❌ Нужно 60 дер, 25 кам`,true); updateUI(); }
    function buildMarket() { if(game.wood>=80 && game.stone>=40) { game.wood-=80; game.stone-=40; game.markets++; game.marketIncome+=6; addLog(`📊 Рынок построен! +6 зол/ход`); playSound('build'); } else addLog(`❌ Нужно 80 дер, 40 кам`,true); updateUI(); }
    function buildTavern() { if(game.wood>=60 && game.stone>=20 && game.food>=20) { game.wood-=60; game.stone-=20; game.food-=20; game.taverns++; addLog(`🍺 Таверна построена! Счастье +5/ход`); playSound('build'); } else addLog(`❌ Нужно 60 дер, 20 кам, 20 еды`,true); updateUI(); }
    function buildForge() { if(game.wood>=100 && game.iron>=50) { game.wood-=100; game.iron-=50; game.forges++; addLog(`⚔️ Кузница построена! +20% добычи`); playSound('build'); } else addLog(`❌ Нужно 100 дер, 50 жел`,true); updateUI(); }
    function buildGuild() { if(game.wood>=150 && game.stone>=80 && game.mithril>=30) { game.wood-=150; game.stone-=80; game.mithril-=30; game.guilds++; addLog(`🔮 Гильдия магов построена! +10 науки/ход`); playSound('build'); } else addLog(`❌ Нужно 150 дер, 80 кам, 30 миф`,true); updateUI(); }
    function buildObservatory() { if(game.wood>=70 && game.stone>=35) { game.wood-=70; game.stone-=35; game.observatories++; addLog(`🔭 Обсерватория построена!`); playSound('build'); } else addLog(`❌ Нужно 70 дер, 35 кам`,true); updateUI(); }
    function expandLand() { if(game.wood>=30) { game.wood-=30; game.landArea+=120; game.farms++; addLog(`🗺️ Земли расширены!`); playSound('build'); } else addLog(`❌ Нужно 30 дер`,true); updateUI(); }
    
    function sellWoodTrade() { if(game.wood>=20) { game.wood-=20; let p=24+Math.floor(Math.random()*7); game.gold+=p; addLog(`🪵 Продано 20 дер за ${p} зол`); playSound('click'); } else addLog(`Нет дерева`,true); updateUI(); }
    function sellStoneTrade() { if(game.stone>=15) { game.stone-=15; game.gold+=28; addLog(`⛰️ Продано 15 кам за 28 зол`); playSound('click'); } else addLog(`Мало камня`,true); updateUI(); }
    function sellCoalTrade() { if(game.coal>=15) { game.coal-=15; game.gold+=25; addLog(`🪨 Продано 15 угля за 25 зол`); playSound('click'); } else addLog(`Мало угля`,true); updateUI(); }
    function sellIronTrade() { if(game.iron>=10) { game.iron-=10; game.gold+=40; addLog(`⚙️ Продано 10 жел за 40 зол`); playSound('click'); } else addLog(`Мало железа`,true); updateUI(); }
    function sellGemTrade() { if(game.gems>=1) { game.gems--; game.gold+=60; addLog(`💎 Продана драгоценность за 60 зол`); playSound('click'); } else addLog(`Нет драгоценностей`,true); updateUI(); }
    function buyFoodTrade() { if(game.gold>=25) { let f=30+Math.floor(Math.random()*5); game.gold-=25; game.food+=f; addLog(`🍞 Куплено ${f} еды`); playSound('click'); } else addLog(`Мало золота`,true); updateUI(); }
    function investTrade() { if(game.gold>=50) { game.gold-=50; game.marketIncome+=4; addLog(`📈 Инвестиции +4 зол/ход`); playSound('click'); } else addLog(`Нужно 50 зол`,true); updateUI(); }
    
    function lawBirth() { if(game.gold>=15) { game.gold-=15; game.birthBonus+=0.8; addLog(`👶 Указ рождаемости!`); playSound('click'); } else addLog(`Нужно 15 зол`,true); updateUI(); }
    function lawForest() { if(game.wood>=10) { game.wood-=10; game.forestRegenBonus=true; addLog(`🌳 Лесной указ!`); playSound('click'); } else addLog(`Нужно 10 дер`,true); updateUI(); }
    function lawHarvest() { if(game.wood>=25 && !game.harvestLaw) { game.wood-=25; game.harvestLaw=true; addLog(`🌽 Севооборот +10% урожая`); playSound('click'); } else addLog(`Уже принят или нет дер`,true); updateUI(); }
    
    function updateTech(tech, cost, effect) { if(game.science>=cost && !game.techs[tech]) { game.science-=cost; game.techs[tech]=true; effect(); addLog(`📚 Изучено: ${tech}`); playSound('achievement'); updateUI(); } else addLog(`❌ Не хватает науки`, true); }
    
    function saveGame() { localStorage.setItem('kingdomSaveEpic', JSON.stringify(game)); addLog(`💾 Игра сохранена!`); playSound('click'); }
    function loadGame() { let save = localStorage.getItem('kingdomSaveEpic'); if(save) { Object.assign(game, JSON.parse(save)); updateUI(); addLog(`📀 Игра загружена!`); playSound('click'); } else addLog(`❌ Нет сохранения`, true); }
    function resetGame() { location.reload(); }
    
    function updateUI() {
        document.getElementById('resPanel').innerHTML = `
            <div class="res-card">🍞 ${Math.floor(game.food)}</div>
            <div class="res-card">🪵 ${Math.floor(game.wood)}</div>
            <div class="res-card">⛰️ ${Math.floor(game.stone)}</div>
            <div class="res-card">🪨 ${Math.floor(game.coal)}</div>
            <div class="res-card">⚙️ ${Math.floor(game.iron)}</div>
            <div class="res-card">💎 ${Math.floor(game.gems)}</div>
            <div class="res-card">✨ ${Math.floor(game.mithril)}</div>
            <div class="res-card">🔮 ${Math.floor(game.mana)}</div>
            <div class="res-card">🪙 ${Math.floor(game.gold)}</div>
            <div class="res-card">👥 ${Math.floor(game.population)}/${maxPopulation()}</div>
            <div class="res-card">🔬 ${Math.floor(game.science)}</div>
        `;
        document.getElementById('quickStats').innerHTML = `<span class="stat-badge">😊 ${Math.floor(game.happiness)}%</span><span class="stat-badge">🌾 ${game.farms} полей</span><span class="stat-badge">🏠 ${game.houses} домов</span><span class="stat-badge">⛏️ ${game.mines} шахт</span><span class="stat-badge">🏛️ рынков:${game.markets}</span><span class="stat-badge">🏆 +${game.conqueredBonus}%</span>`;
        document.getElementById('turnCount').innerText = game.turn;
        document.getElementById('sciencePoints').innerText = Math.floor(game.science);
        document.getElementById('hapVal').innerText = Math.floor(game.happiness);
        document.getElementById('tradeReputation').innerHTML = `🤝 Репутация: ${Math.floor(game.tradeReputation)}%`;
        document.getElementById('woodDepletionFill').style.width = `${game.forestDensity}%`;
        document.getElementById('resourceStatus').innerHTML = `🌲 Леса: ${game.forestDensity>60?"богатые":game.forestDensity>30?"средние":"истощённые"} (${Math.floor(game.forestDensity)}%)`;
        
        if(game.crisis.active) document.getElementById('crisisPanel').innerHTML = `<div class="crisis-warning">⚠️ КРИЗИС: ${game.crisis.type} (ещё ${game.crisis.turnsLeft} ходов) ⚠️</div>`;
        else document.getElementById('crisisPanel').innerHTML = '';
        
        let achievementsHtml = '';
        for(let [key, val] of Object.entries(game.achievements)) { if(val) { let names = {firstHouse:'🏠 5 домов', firstFarm:'🌾 5 полей', firstMine:'⛏️ 3 шахты', population50:'👥 50 жителей', science100:'🔬 100 науки', firstGem:'💎 Драгоценности', firstMithril:'✨ Мифрил'}; achievementsHtml += `<div class="achievement">✅ ${names[key]}</div>`; } }
        document.getElementById('achievementsPanel').innerHTML = achievementsHtml || '<div class="achievement">⭐ Нет достижений</div>';
        
        let techHtml = `
            <div class="tech-item">🌾 Севооборот (35) <button onclick="updateTech('cropRotation',35,()=>{})">Изучить</button>${game.techs.cropRotation?'✅':''}</div>
            <div class="tech-item">🪵 Лесопилка (45) <button onclick="updateTech('sawmill',45,()=>{})">Изучить</button>${game.techs.sawmill?'✅':''}</div>
            <div class="tech-item">⛏️ Улучш. кирки (50) <button onclick="updateTech('miningPick',50,()=>{})">Изучить</button>${game.techs.miningPick?'✅':''}</div>
            <div class="tech-item">📦 Торг. пути (60) <button onclick="updateTech('tradeRoutes',60,()=>{ game.marketIncome+=3; updateUI(); })">Изучить</button>${game.techs.tradeRoutes?'✅':''}</div>
            <div class="tech-item">🏛️ Архитектура (70) <button onclick="updateTech('architecture',70,()=>{})">Изучить</button>${game.techs.architecture?'✅':''}</div>
            <div class="tech-item">🔮 Магия (100) <button onclick="updateTech('magic',100,()=>{ addLog('🔮 Магия открыта!'); updateUI(); })">Изучить</button>${game.techs.magic?'✅':''}</div>`;
        document.getElementById('techPanel').innerHTML = techHtml;
        
        document.getElementById('fullStats').innerHTML = `
            <div class="stat-line">🏰 ${game.name}</div>
            <div class="stat-line">🗺️ Площадь: ${Math.floor(game.landArea)} км²</div>
            <div class="stat-line">🏠 Дома: ${game.houses} (макс. ${maxPopulation()})</div>
            <div class="stat-line">🌾 Поля: ${game.farms} | ⛏️ Шахт: ${game.mines}</div>
            <div class="stat-line">🏛️ Рынки:${game.markets} | 🍺 Таверны:${game.taverns} | ⚔️ Кузницы:${game.forges} | 🔮 Гильдии:${game.guilds}</div>
            <div class="stat-line">📈 Доход/ход: рынок ${game.marketIncome} зол.</div>
            <div class="stat-line">🌲 Лес: ${Math.floor(game.forestDensity)}% | 👶 Рожд.бонус: +${game.birthBonus.toFixed(1)}</div>
            <div class="stat-line">📚 Технологий: ${Object.values(game.techs).filter(v=>v===true).length}/6</div>
            <div class="stat-line">🔬 Наука/ход: ${calcScienceProduction()}</div>
        `;
    }
    
    function initModals() {
        const modals = document.querySelectorAll('.modal');
        const navBtns = document.querySelectorAll('.nav-btn');
        const closeBtns = document.querySelectorAll('.close-modal');
        function openModal(id) { document.getElementById(id).style.display = 'flex'; playSound('click'); }
        function closeAll() { modals.forEach(m => m.style.display = 'none'); }
        navBtns.forEach(btn => { btn.onclick = () => { closeAll(); openModal(btn.dataset.modal); }; });
        closeBtns.forEach(btn => { btn.onclick = () => closeAll(); });
        window.onclick = (e) => { if(e.target.classList.contains('modal')) closeAll(); };
        
        document.getElementById('gatherWoodBtn').onclick = () => { gatherWood(); closeAll(); };
        document.getElementById('gatherStoneBtn').onclick = () => { gatherStone(); closeAll(); };
        document.getElementById('gatherCoalBtn').onclick = () => { gatherCoal(); closeAll(); };
        document.getElementById('gatherIronBtn').onclick = () => { gatherIron(); closeAll(); };
        document.getElementById('mineMithrilBtn').onclick = () => { mineMithril(); closeAll(); };
        document.getElementById('gatherManaBtn').onclick = () => { gatherMana(); closeAll(); };
        document.getElementById('buildFarmBtn').onclick = () => { buildFarm(); closeAll(); };
        document.getElementById('buildHouseBtn').onclick = () => { buildHouse(); closeAll(); };
        document.getElementById('buildMineBtn').onclick = () => { buildMine(); closeAll(); };
        document.getElementById('buildMarketBtn').onclick = () => { buildMarket(); closeAll(); };
        document.getElementById('buildTavernBtn').onclick = () => { buildTavern(); closeAll(); };
        document.getElementById('buildForgeBtn').onclick = () => { buildForge(); closeAll(); };
        document.getElementById('buildGuildBtn').onclick = () => { buildGuild(); closeAll(); };
        document.getElementById('buildObservatoryBtn').onclick = () => { buildObservatory(); closeAll(); };
        document.getElementById('expandLandBtn').onclick = () => { expandLand(); closeAll(); };
        
        document.getElementById('sellWoodTrade').onclick = () => { sellWoodTrade(); closeAll(); };
        document.getElementById('sellStoneTrade').onclick = () => { sellStoneTrade(); closeAll(); };
        document.getElementById('sellCoalTrade').onclick = () => { sellCoalTrade(); closeAll(); };
        document.getElementById('sellIronTrade').onclick = () => { sellIronTrade(); closeAll(); };
        document.getElementById('sellGemTrade').onclick = () => { sellGemTrade(); closeAll(); };
        document.getElementById('buyFoodTrade').onclick = () => { buyFoodTrade(); closeAll(); };
        document.getElementById('investTradeBtn').onclick = () => { investTrade(); closeAll(); };
        
        document.getElementById('lawBirthBtn').onclick = () => { lawBirth(); closeAll(); };
        document.getElementById('lawForestBtn').onclick = () => { lawForest(); closeAll(); };
        document.getElementById('lawHarvestBtn').onclick = () => { lawHarvest(); closeAll(); };
        
        document.getElementById('resetGameBtn').onclick = () => resetGame();
        document.getElementById('saveGameBtn').onclick = () => { saveGame(); closeAll(); };
        document.getElementById('loadGameBtn').onclick = () => { loadGame(); closeAll(); };
        document.getElementById('pauseGameBtn').onclick = () => { gamePaused = !gamePaused; document.getElementById('pauseGameBtn').innerText = gamePaused ? '▶️' : '⏸️'; addLog(gamePaused ? "⏸️ Пауза" : "▶️ Продолжение"); playSound('click'); };
        
        document.getElementById('kingdomNameInput').onchange = () => { game.name = document.getElementById('kingdomNameInput').value; updateUI(); };
        
        window.updateTech = updateTech;
    }
    
    initModals();
    gameInterval = setInterval(() => gameTick(), 14000);
    updateUI();
    addLog("🏆 Новые ресурсы! Железо, драгоценности, мифрил, мана. Кризисы могут уничтожить королевство!");
</script>
</body>
</html>
