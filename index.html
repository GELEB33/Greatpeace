<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Королевство: Песочница</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #1a3a2a; font-family: 'Segoe UI', system-ui, sans-serif; padding: 12px; padding-bottom: 85px; min-height: 100vh; }
        .game-wrapper { max-width: 600px; margin: 0 auto; background: #fef7e0; border-radius: 48px 32px; box-shadow: 0 12px 28px rgba(0,0,0,0.4); overflow: hidden; padding: 16px; }
        .kingdom-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .kingdom-name-input { background: #2c241a; border: none; padding: 6px 12px; border-radius: 30px; color: #ffefcf; font-weight: bold; font-size: 0.9rem; width: 160px; text-align: center; }
        .turn-counter { background: #b97f44; padding: 6px 12px; border-radius: 30px; color: white; font-size: 0.75rem; display: flex; gap: 8px; align-items: center; }
        .pause-btn { background: #6a4a2a; border: none; color: white; padding: 4px 10px; border-radius: 30px; cursor: pointer; }
        .resources-scroll { overflow-x: auto; white-space: nowrap; margin-bottom: 12px; }
        .resources-flex { display: inline-flex; gap: 8px; }
        .res-card { background: #2c241ae6; padding: 5px 12px; border-radius: 40px; display: inline-flex; align-items: center; gap: 6px; color: #ffefcf; font-weight: bold; font-size: 0.8rem; }
        .quick-stats { background: #e9dbbc; border-radius: 24px; padding: 8px 12px; margin-bottom: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; font-size: 0.7rem; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1f2f1cee; backdrop-filter: blur(12px); display: flex; justify-content: space-around; padding: 8px 12px 18px; border-top: 1px solid #e6c48b; z-index: 100; max-width: 600px; margin: 0 auto; border-radius: 32px 32px 0 0; flex-wrap: wrap; }
        .nav-btn { background: #4a3924; border: none; color: #ffe2b5; font-size: 0.55rem; padding: 5px 4px; border-radius: 40px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: bold; cursor: pointer; flex: 1; min-width: 55px; margin: 2px; }
        .nav-btn span:first-child { font-size: 1.1rem; }
        .nav-btn:active { transform: scale(0.96); background: #6d4f30; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
        .modal-card { background: #fef2de; max-width: 500px; width: 100%; max-height: 85vh; border-radius: 40px; padding: 18px; overflow-y: auto; }
        .modal-card h3 { font-size: 1.3rem; margin-bottom: 12px; border-left: 6px solid #b97f44; padding-left: 12px; }
        .close-modal { background: #a76f3c; float: right; border: none; padding: 4px 12px; border-radius: 30px; color: white; cursor: pointer; }
        .action-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
        .action-btn { background: #e4cfaa; border: none; padding: 8px 12px; border-radius: 40px; font-weight: bold; display: flex; justify-content: space-between; font-size: 0.8rem; cursor: pointer; }
        .event-log { background: #2f2a1f; border-radius: 24px; padding: 8px; color: #fbeccd; font-size: 0.7rem; max-height: 120px; overflow-y: auto; margin-top: 12px; }
        .stat-line { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #d4b87a; font-size: 0.8rem; }
        .progress { background: #6a5a44; border-radius: 20px; height: 8px; margin: 8px 0; }
        .progress-fill { background: #cd9f5a; width: 50%; height: 8px; border-radius: 20px; }
        .achievement { background: #4a6a3a; border-radius: 20px; padding: 5px 10px; margin: 5px 0; color: #ffefcf; font-size: 0.7rem; }
        .canvas-container { background: #2f2a1f; border-radius: 16px; padding: 8px; margin-top: 12px; }
        canvas { width: 100%; height: 100px; background: #1e1b16; border-radius: 12px; }
        footer { font-size: 0.5rem; text-align: center; margin-top: 12px; color: #b48b54; }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="kingdom-header">
        <input type="text" id="kingdomNameInput" class="kingdom-name-input" value="Северный Престол" maxlength="25">
        <div class="turn-counter">📅 Ход: <span id="turnCount">0</span> <button id="pauseGameBtn" class="pause-btn">⏸️</button></div>
    </div>
    <div class="resources-scroll"><div class="resources-flex" id="resPanel"></div></div>
    <div class="quick-stats" id="quickStats"></div>
    <div class="canvas-container"><canvas id="resourceChart" width="500" height="100"></canvas></div>
    <div id="achievementsPanel" class="action-list" style="margin-top:8px;"></div>
    <div class="event-log" id="eventLog"><p>🏰 Добро пожаловать в королевство!</p></div>
</div>

<div class="bottom-nav">
    <button class="nav-btn" data-modal="economyModal"><span>🏭</span><span>Ресурсы</span></button>
    <button class="nav-btn" data-modal="workersModal"><span>👥</span><span>Рабочие</span></button>
    <button class="nav-btn" data-modal="tradeModal"><span>📦</span><span>Торговля</span></button>
    <button class="nav-btn" data-modal="lawsModal"><span>📜</span><span>Законы</span></button>
    <button class="nav-btn" data-modal="techModal"><span>📚</span><span>Технологии</span></button>
    <button class="nav-btn" data-modal="infoModal"><span>📊</span><span>Статистика</span></button>
</div>

<!-- МОДАЛЬНЫЕ ОКНА -->
<div id="economyModal" class="modal"><div class="modal-card"><button class="close-modal">✖️</button><h3>🏭 Ресурсы и стройка</h3><div class="action-list">
    <button class="action-btn" id="gatherWoodBtn">🪵 Рубить лес (+8-16 дерева)</button>
    <button class="action-btn" id="gatherStoneBtn">⛰️ Добыть камень (+5-10 камня)</button>
    <button class="action-btn" id="gatherCoalBtn">🪨 Добыть уголь (+4-8 угля)</button>
    <button class="action-btn" id="buildFarmBtn">🌾 Построить поле (-35 дер, +1 поле, +2 раб.места)</button>
    <button class="action-btn" id="buildHouseBtn">🏠 Построить дом (-40 дер, +6 жилья)</button>
    <button class="action-btn" id="buildMineBtn">⛏️ Шахта (-60 дер, -25 камня, +4 раб.места)</button>
    <button class="action-btn" id="buildObservatoryBtn">🔭 Обсерватория (-70 дер, -35 камня, +3 учёных)</button>
    <button class="action-btn" id="expandLandBtn">🗺️ Освоить земли (-30 дер, +120 площади, +1 поле)</button>
</div>
<div class="progress"><div class="progress-fill" id="woodDepletionFill" style="width:100%"></div></div>
<div id="resourceStatus" style="font-size:0.7rem;">🌲 Леса: богатые</div>
</div></div>

<div id="workersModal" class="modal"><div class="modal-card"><button class="close-modal">✖️</button><h3>👥 Распределение рабочих</h3>
    <div id="workersPanel"></div>
    <div>📊 Безработные: <span id="unemployedSpan">0</span></div>
    <div class="action-list"><button class="action-btn" id="autoAssignBtn">🤖 Автораспределение</button></div>
</div></div>

<div id="tradeModal" class="modal"><div class="modal-card"><button class="close-modal">✖️</button><h3>📦 Торговля</h3>
    <div class="action-list">
        <button class="action-btn" id="sellWoodTrade">🪵 Продать 20 дерева → +24-30 золота</button>
        <button class="action-btn" id="sellStoneTrade">⛰️ Продать 15 камня → +28 золота</button>
        <button class="action-btn" id="sellCoalTrade">🪨 Продать 15 угля → +25 золота</button>
        <button class="action-btn" id="buyFoodTrade">🍞 Купить 30 еды → -25 золота</button>
        <button class="action-btn" id="investTradeBtn">📈 Инвестиции (-50 зол, +4 золота/ход)</button>
        <button class="action-btn" id="upgradeLoggingBtn">🪓 Улучшить лесопилку (-70 зол, +25% добычи)</button>
        <button class="action-btn" id="upgradeMiningBtn">⛏️ Улучшить шахты (-80 зол, +20% добычи)</button>
    </div>
    <div id="tradeReputation">🤝 Репутация: 50%</div>
</div></div>

<div id="lawsModal" class="modal"><div class="modal-card"><button class="close-modal">✖️</button><h3>📜 Законы</h3>
    <div class="action-list">
        <button class="action-btn" id="lawBirthBtn">👶 Указ рождаемости (+0.8 рождаемость/ход, -15 зол)</button>
        <button class="action-btn" id="lawForestBtn">🌳 Лесной указ (+8% восстановления леса, -10 дер)</button>
        <button class="action-btn" id="lawHarvestBtn">🌽 Закон о севообороте (+10% урожая, -25 дер)</button>
    </div>
    <div>😊 Счастье: <span id="hapVal">70</span>%</div>
</div></div>

<div id="techModal" class="modal"><div class="modal-card"><button class="close-modal">✖️</button><h3>📚 Технологии</h3><div id="techPanel"></div><div>🔬 Очки науки: <span id="sciencePoints">0</span></div><div>🔭 Обсерваторий: <span id="observatoryCount">0</span></div></div></div>

<div id="infoModal" class="modal"><div class="modal-card"><button class="close-modal">✖️</button><h3>📊 Полная статистика</h3><div id="fullStats"></div><button id="resetGameBtn" style="background:#b1624b; margin-top:16px;">🔄 Переродить королевство</button><button id="saveGameBtn" style="background:#4a6a3a; margin-top:8px;">💾 Сохранить игру</button><button id="loadGameBtn" style="background:#4a6a3a; margin-top:4px;">📀 Загрузить сохранение</button></div></div>

<script>
    // ==================== СОСТОЯНИЕ ИГРЫ ====================
    let game = {
        name: "Северный Престол",
        turn: 0,
        food: 80, wood: 50, stone: 20, coal: 15, gold: 40,
        population: 10,
        houses: 3, farms: 1, mines: 0, observatories: 0,
        landArea: 300, forestDensity: 85, conqueredBonus: 0,
        workers: { farmers: 0, lumberjacks: 0, miners: 0, scientists: 0, builders: 0, traders: 0 },
        maxWorkers: { farmers: 2, lumberjacks: 6, miners: 0, scientists: 0, builders: 8, traders: 6 },
        birthBonus: 0, marketIncome: 0, happiness: 70,
        loggingUpgrade: false, miningUpgrade: false, forestRegenBonus: false, harvestLaw: false,
        tradeReputation: 50,
        techs: { cropRotation: false, sawmill: false, miningPick: false, tradeRoutes: false, architecture: false, astronomy: false },
        science: 0, famineCounter: 0,
        achievements: { firstHouse: false, firstFarm: false, firstMine: false, population50: false, science100: false }
    };
    
    let gameActive = true;
    let gamePaused = false;
    let gameInterval = null;
    let resourceHistory = { food: [], wood: [], gold: [] };
    
    function maxPopulation() { return game.houses * 8 + 25; }
    function updateMaxWorkers() {
        game.maxWorkers.farmers = game.farms * 2;
        game.maxWorkers.miners = game.mines * 4;
        game.maxWorkers.scientists = game.observatories * 3;
    }
    function totalWorkers() { return Object.values(game.workers).reduce((a,b)=>a+b,0); }
    function unemployed() { return Math.max(0, game.population - totalWorkers()); }
    
    function addLog(msg, isError = false) {
        const logDiv = document.getElementById('eventLog');
        const p = document.createElement('p');
        p.innerHTML = `📜 ${msg}`;
        if(isError) p.style.color = "#ffb28b";
        logDiv.prepend(p);
        if(logDiv.children.length > 10) logDiv.removeChild(logDiv.lastChild);
    }
    
    function checkAchievements() {
        let newAchiev = false;
        if(game.houses >= 5 && !game.achievements.firstHouse) { game.achievements.firstHouse = true; addLog("🏆 Достижение: 5 домов построено!"); newAchiev = true; }
        if(game.farms >= 5 && !game.achievements.firstFarm) { game.achievements.firstFarm = true; addLog("🏆 Достижение: 5 полей возделано!"); newAchiev = true; }
        if(game.mines >= 3 && !game.achievements.firstMine) { game.achievements.firstMine = true; addLog("🏆 Достижение: 3 шахты построено!"); newAchiev = true; }
        if(game.population >= 50 && !game.achievements.population50) { game.achievements.population50 = true; addLog("🏆 Достижение: 50 жителей!"); newAchiev = true; }
        if(game.science >= 100 && !game.achievements.science100) { game.achievements.science100 = true; addLog("🏆 Достижение: 100 очков науки!"); newAchiev = true; }
        if(newAchiev) updateUI();
    }
    
    // производство
    function calcFoodProduction() {
        let workers = Math.min(game.workers.farmers, game.maxWorkers.farmers);
        let base = workers * 2.2 + game.farms * 1.0;
        let bonus = 1 + (game.conqueredBonus/100);
        if(game.techs.cropRotation || game.harvestLaw) base *= 1.1;
        let happinessMod = Math.max(0.4, 0.6 + (game.happiness/200));
        if(game.famineCounter > 0) { base *= 0.4; game.famineCounter--; }
        return Math.floor(base * bonus * happinessMod);
    }
    
    function calcWoodProduction() {
        let workers = Math.min(game.workers.lumberjacks, game.maxWorkers.lumberjacks);
        let base = workers * 1.8;
        if(game.techs.sawmill || game.loggingUpgrade) base *= 1.25;
        let modifier = game.forestDensity / 100;
        let gained = Math.floor(base * (0.5 + modifier * 0.8));
        game.forestDensity = Math.max(5, game.forestDensity - (Math.random() * 4));
        return Math.max(2, gained);
    }
    
    function calcStoneCoalProduction() {
        let workers = Math.min(game.workers.miners, game.maxWorkers.miners);
        let stoneBase = workers * 1.0;
        let coalBase = workers * 1.2;
        if(game.techs.miningPick || game.miningUpgrade) { stoneBase *= 1.2; coalBase *= 1.2; }
        return { stone: Math.floor(stoneBase), coal: Math.floor(coalBase) };
    }
    
    function calcScienceProduction() {
        let workers = Math.min(game.workers.scientists, game.maxWorkers.scientists);
        let base = workers * 2 + game.observatories * 4;
        if(game.techs.astronomy) base *= 1.2;
        return Math.floor(base);
    }
    
    function regrowForest() { game.forestDensity = Math.min(100, game.forestDensity + (game.forestRegenBonus ? 4 : 2)); }
    
    // случайные события с королевствами
    function triggerRandomEvent() {
        if(Math.random() > 0.2) return;
        let events = [
            { name: "🚚 Торговый караван", effect: () => { let goldGain = 25 + Math.floor(Math.random()*20); game.gold += goldGain; addLog(`🚚 Караван из соседнего королевства продал товары! +${goldGain} золота`); }, weight: 12 },
            { name: "🤝 Посол королевства", effect: () => { let foodGain = 20 + Math.floor(Math.random()*15); game.food += foodGain; addLog(`🤝 Посол прислал дары! +${foodGain} еды`); }, weight: 10 },
            { name: "⚔️ Набег кочевников", effect: () => { let loss = Math.floor(game.gold * 0.15); game.gold = Math.max(0, game.gold - loss); addLog(`⚔️ Набег кочевников! Потеряно ${loss} золота`, true); }, weight: 8 },
            { name: "🎁 Королевский подарок", effect: () => { let woodGain = 25 + Math.floor(Math.random()*20); game.wood += woodGain; addLog(`🎁 Дружественное королевство прислало древесину! +${woodGain}`); }, weight: 9 },
            { name: "💒 Королевская свадьба", effect: () => { game.happiness = Math.min(100, game.happiness+8); addLog(`💒 Свадьба с соседним принцем! Счастье +8`); }, weight: 7 },
            { name: "🏰 Приют для беженцев", effect: () => { let refugees = 3 + Math.floor(Math.random()*5); game.population += refugees; addLog(`🏰 Беженцы из соседней страны прибыли! +${refugees} человек`); }, weight: 8 },
            { name: "📜 Ультиматум", effect: () => { if(game.gold > 40) { game.gold -= 30; addLog(`📜 Соседи потребовали дань! -30 золота`, true); } else { addLog(`📜 Соседи угрожают, но у нас нет золота!`); } }, weight: 6 }
        ];
        let totalWeight = events.reduce((s,e)=>s+e.weight,0);
        let rand = Math.random() * totalWeight;
        let accum = 0;
        for(let e of events) {
            accum += e.weight;
            if(rand <= accum) { e.effect(); break; }
        }
    }
    
    // ход игры
    function gameTick() {
        if(!gameActive || gamePaused) return;
        game.turn++;
        updateMaxWorkers();
        
        let foodProd = calcFoodProduction();
        let woodProd = calcWoodProduction();
        let minerals = calcStoneCoalProduction();
        let scienceProd = calcScienceProduction();
        
        game.food += foodProd;
        game.wood += woodProd;
        game.stone += minerals.stone;
        game.coal += minerals.coal;
        game.science += scienceProd;
        
        game.gold += game.marketIncome;
        
        let consumption = Math.floor(game.population * 0.65);
        if(game.food >= consumption) game.food -= consumption;
        else { let starve = Math.floor((consumption - game.food) / 0.7); game.population = Math.max(3, game.population - starve); game.food = 0; addLog(`💀 Голод! -${starve} жителей`, true); }
        
        let birthRate = 0.025 + (game.birthBonus/100) + (game.happiness/1500);
        let births = Math.min(Math.floor(game.population * birthRate), maxPopulation() - game.population);
        if(births > 0) { game.population += births; addLog(`👶 Родилось +${births}`); }
        
        game.happiness = Math.min(100, Math.max(0, game.happiness - 0.3 + (game.food > game.population ? 0.6 : -0.8)));
        if(game.happiness < 15) { addLog(`⚠️ НАРОД НЕДОВОЛЕН! Счастье критически низкое!`, true); }
        if(game.happiness < 5) { let loss = Math.floor(game.population * 0.2); game.population = Math.max(3, game.population - loss); game.happiness = 20; addLog(`💀 МЯТЕЖ! Потеряно ${loss} человек!`, true); }
        
        regrowForest();
        triggerRandomEvent();
        if(Math.random() < 0.07 && game.famineCounter === 0) game.famineCounter = 1;
        
        game.population = Math.min(maxPopulation(), game.population);
        game.food = Math.max(0, Math.floor(game.food));
        game.wood = Math.max(0, Math.floor(game.wood));
        game.stone = Math.max(0, Math.floor(game.stone));
        game.coal = Math.max(0, Math.floor(game.coal));
        game.gold = Math.max(0, Math.floor(game.gold));
        game.tradeReputation = Math.min(90, Math.max(20, game.tradeReputation + (Math.random() - 0.5) * 1));
        
        resourceHistory.food.push(game.food);
        resourceHistory.wood.push(game.wood);
        resourceHistory.gold.push(game.gold);
        if(resourceHistory.food.length > 20) resourceHistory.food.shift();
        if(resourceHistory.wood.length > 20) resourceHistory.wood.shift();
        if(resourceHistory.gold.length > 20) resourceHistory.gold.shift();
        
        checkAchievements();
        updateUI();
        drawChart();
        if(game.population <= 2) { addLog("💀 КОРОЛЕВСТВО ПАЛО! Обновите страницу.", true); clearInterval(gameInterval); gameActive = false; }
    }
    
    // действия
    function gatherWood() { let gain = 8+Math.floor(Math.random()*9); game.wood += gain; addLog(`🪵 +${gain} дерева`); updateUI(); }
    function gatherStone() { let gain = 5+Math.floor(Math.random()*6); game.stone += gain; addLog(`⛰️ +${gain} камня`); updateUI(); }
    function gatherCoal() { let gain = 4+Math.floor(Math.random()*5); game.coal += gain; addLog(`🪨 +${gain} угля`); updateUI(); }
    function buildFarm() { if(game.wood>=35) { game.wood-=35; game.farms++; updateMaxWorkers(); addLog(`🌾 Построено поле!`); } else addLog(`❌ Нужно 35 дерева`,true); updateUI(); }
    function buildHouse() { if(game.wood>=40) { game.wood-=40; game.houses++; addLog(`🏠 Построен дом! +6 жилья`); } else addLog(`❌ Нужно 40 дерева`,true); updateUI(); }
    function buildMine() { if(game.wood>=60 && game.stone>=25) { game.wood-=60; game.stone-=25; game.mines++; updateMaxWorkers(); addLog(`⛏️ Шахта построена!`); } else addLog(`❌ Нужно 60 дерева, 25 камня`,true); updateUI(); }
    function buildObservatory() { if(game.wood>=70 && game.stone>=35) { game.wood-=70; game.stone-=35; game.observatories++; updateMaxWorkers(); addLog(`🔭 Обсерватория построена!`); } else addLog(`❌ Нужно 70 дерева, 35 камня`,true); updateUI(); }
    function expandLand() { if(game.wood>=30) { game.wood-=30; game.landArea+=120; game.farms++; addLog(`🗺️ Земли расширены! +120 площади, +1 поле`); } else addLog(`❌ Нужно 30 дерева`,true); updateUI(); }
    
    function assignWorker(type, delta) { let unemp = unemployed(); let newVal = game.workers[type] + delta; if(delta>0 && unemp<=0) { addLog(`❌ Нет свободных рабочих`,true); return; } if(newVal<0) newVal=0; if(newVal > game.maxWorkers[type]) { addLog(`❌ Слишком много`,true); return; } game.workers[type] = newVal; updateUI(); }
    function autoAssign() { let unemp = unemployed(); for(let t of ['farmers','lumberjacks','miners','scientists','builders','traders']) { let free = game.maxWorkers[t] - game.workers[t]; if(free>0 && unemp>0) { let add = Math.min(free, unemp); game.workers[t] += add; unemp -= add; } } addLog(`🤖 Автораспределение`); updateUI(); }
    
    function sellWoodTrade() { if(game.wood>=20) { game.wood-=20; let price = 24+Math.floor(Math.random()*7); game.gold+=price; addLog(`Продано 20 дерева за ${price} золота`); } else addLog(`Нет дерева`,true); updateUI(); }
    function sellStoneTrade() { if(game.stone>=15) { game.stone-=15; game.gold+=28; addLog(`Продано 15 камня за 28 золота`); } else addLog(`Мало камня`,true); updateUI(); }
    function sellCoalTrade() { if(game.coal>=15) { game.coal-=15; game.gold+=25; addLog(`Продано 15 угля за 25 золота`); } else addLog(`Мало угля`,true); updateUI(); }
    function buyFoodTrade() { if(game.gold>=25) { let foodGet = 30+Math.floor(Math.random()*5); game.gold-=25; game.food+=foodGet; addLog(`Куплено ${foodGet} еды`); } else addLog(`Мало золота`,true); updateUI(); }
    function investTrade() { if(game.gold>=50) { game.gold-=50; game.marketIncome+=4; addLog(`📈 Инвестиции +4 золота/ход`); } else addLog(`Нужно 50 золота`,true); updateUI(); }
    function upgradeLogging() { if(game.gold>=70 && !game.loggingUpgrade) { game.gold-=70; game.loggingUpgrade=true; addLog(`🪓 Лесопилка улучшена! +25% добычи`); } else addLog(`Нужно 70 золота`,true); updateUI(); }
    function upgradeMining() { if(game.gold>=80 && !game.miningUpgrade) { game.gold-=80; game.miningUpgrade=true; addLog(`⛏️ Шахты улучшены! +20% добычи`); } else addLog(`Нужно 80 золота`,true); updateUI(); }
    
    function lawBirth() { if(game.gold>=15) { game.gold-=15; game.birthBonus+=0.8; addLog(`👶 Указ рождаемости! +0.8 рождаемости`); } else addLog(`Нужно 15 золота`,true); updateUI(); }
    function lawForest() { if(game.wood>=10) { game.wood-=10; game.forestRegenBonus=true; addLog(`🌳 Лесной указ! +8% восстановления`); } else addLog(`Нужно 10 дерева`,true); updateUI(); }
    function lawHarvest() { if(game.wood>=25 && !game.harvestLaw) { game.wood-=25; game.harvestLaw=true; addLog(`🌽 Севооборот +10% урожая`); } else addLog(`Уже принят или нет дерева`,true); updateUI(); }
    
    function updateTech(tech, cost, effect) { if(game.science>=cost && !game.techs[tech]) { game.science-=cost; game.techs[tech]=true; effect(); addLog(`📚 Изучено: ${tech}`); updateUI(); } else addLog(`❌ Не хватает науки`, true); }
    
    function saveGame() { localStorage.setItem('kingdomSave', JSON.stringify(game)); addLog(`💾 Игра сохранена!`); }
    function loadGame() { let save = localStorage.getItem('kingdomSave'); if(save) { Object.assign(game, JSON.parse(save)); updateMaxWorkers(); updateUI(); addLog(`📀 Игра загружена! Ход ${game.turn}`); } else addLog(`❌ Нет сохранения`, true); }
    function resetGame() { location.reload(); }
    
    function drawChart() {
        let canvas = document.getElementById('resourceChart');
        let ctx = canvas.getContext('2d');
        let w = canvas.clientWidth, h = canvas.clientHeight;
        canvas.width = w; canvas.height = h;
        ctx.fillStyle = '#1e1b16'; ctx.fillRect(0,0,w,h);
        if(resourceHistory.food.length<2) return;
        let maxVal = Math.max(...resourceHistory.food, ...resourceHistory.wood, ...resourceHistory.gold, 100);
        let stepX = w / 20;
        ctx.beginPath(); ctx.strokeStyle = '#cd9f5a'; ctx.lineWidth = 2;
        for(let i=0;i<resourceHistory.food.length;i++) { let x = i*stepX; let y = h - (resourceHistory.food[i]/maxVal)*h; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); } ctx.stroke();
        ctx.beginPath(); ctx.strokeStyle = '#6f9e4f'; ctx.lineWidth = 2;
        for(let i=0;i<resourceHistory.wood.length;i++) { let x = i*stepX; let y = h - (resourceHistory.wood[i]/maxVal)*h; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); } ctx.stroke();
        ctx.beginPath(); ctx.strokeStyle = '#c97e5a'; ctx.lineWidth = 2;
        for(let i=0;i<resourceHistory.gold.length;i++) { let x = i*stepX; let y = h - (resourceHistory.gold[i]/maxVal)*h; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); } ctx.stroke();
    }
    
    function updateUI() {
        document.getElementById('resPanel').innerHTML = `
            <div class="res-card">🍞 ${Math.floor(game.food)}</div>
            <div class="res-card">🪵 ${Math.floor(game.wood)}</div>
            <div class="res-card">⛰️ ${Math.floor(game.stone)}</div>
            <div class="res-card">🪨 ${Math.floor(game.coal)}</div>
            <div class="res-card">🪙 ${Math.floor(game.gold)}</div>
            <div class="res-card">👥 ${Math.floor(game.population)}/${maxPopulation()}</div>
            <div class="res-card">🔬 ${Math.floor(game.science)}</div>
        `;
        document.getElementById('quickStats').innerHTML = `<span>😊 ${Math.floor(game.happiness)}%</span><span>🌾 ${game.farms} полей</span><span>🏠 ${game.houses} домов</span><span>⛏️ ${game.mines} шахт</span><span>🔭 ${game.observatories}</span><span>🏆 +${game.conqueredBonus}%</span>`;
        document.getElementById('turnCount').innerText = game.turn;
        document.getElementById('sciencePoints').innerText = Math.floor(game.science);
        document.getElementById('unemployedSpan').innerText = unemployed();
        document.getElementById('hapVal').innerText = Math.floor(game.happiness);
        document.getElementById('tradeReputation').innerHTML = `🤝 Репутация: ${Math.floor(game.tradeReputation)}%`;
        document.getElementById('woodDepletionFill').style.width = `${game.forestDensity}%`;
        document.getElementById('observatoryCount').innerText = game.observatories;
        document.getElementById('resourceStatus').innerHTML = `🌲 Леса: ${game.forestDensity>60?"богатые":game.forestDensity>30?"средние":"истощённые"} (${Math.floor(game.forestDensity)}%) | 🪓 ${game.loggingUpgrade?"улучш.":"обыч."} | ⛏️ ${game.miningUpgrade?"улучш.":"обыч."}`;
        
        let workersHtml = `<div class="action-list">`;
        workersHtml += `<div>🌾 Фермеры: ${game.workers.farmers}/${game.maxWorkers.farmers} <button class="action-btn" onclick="assignWorker('farmers',1)">+</button> <button onclick="assignWorker('farmers',-1)">-</button></div>`;
        workersHtml += `<div>🪵 Лесорубы: ${game.workers.lumberjacks}/${game.maxWorkers.lumberjacks} <button onclick="assignWorker('lumberjacks',1)">+</button> <button onclick="assignWorker('lumberjacks',-1)">-</button></div>`;
        workersHtml += `<div>⛏️ Шахтёры: ${game.workers.miners}/${game.maxWorkers.miners} <button onclick="assignWorker('miners',1)">+</button> <button onclick="assignWorker('miners',-1)">-</button></div>`;
        workersHtml += `<div>🔭 Учёные: ${game.workers.scientists}/${game.maxWorkers.scientists} <button onclick="assignWorker('scientists',1)">+</button> <button onclick="assignWorker('scientists',-1)">-</button></div>`;
        workersHtml += `<div>🏗️ Строители: ${game.workers.builders}/${game.maxWorkers.builders} <button onclick="assignWorker('builders',1)">+</button> <button onclick="assignWorker('builders',-1)">-</button></div>`;
        workersHtml += `<div>📦 Торговцы: ${game.workers.traders}/${game.maxWorkers.traders} <button onclick="assignWorker('traders',1)">+</button> <button onclick="assignWorker('traders',-1)">-</button></div>`;
        workersHtml += `</div>`;
        document.getElementById('workersPanel').innerHTML = workersHtml;
        
        let techHtml = `
            <div class="tech-item">🌾 Севооборот (35 н) <button onclick="updateTech('cropRotation',35,()=>{})">Изучить</button>${game.techs.cropRotation?'✅':''}</div>
            <div class="tech-item">🪵 Лесопилка (45 н) <button onclick="updateTech('sawmill',45,()=>{})">Изучить</button>${game.techs.sawmill?'✅':''}</div>
            <div class="tech-item">⛏️ Улучш. кирки (50 н) <button onclick="updateTech('miningPick',50,()=>{})">Изучить</button>${game.techs.miningPick?'✅':''}</div>
            <div class="tech-item">📦 Торг. пути (60 н) <button onclick="updateTech('tradeRoutes',60,()=>{ game.marketIncome+=3; addLog('📦 +3 золота/ход'); updateUI(); })">Изучить</button>${game.techs.tradeRoutes?'✅':''}</div>
            <div class="tech-item">🏛️ Архитектура (70 н) <button onclick="updateTech('architecture',70,()=>{ addLog('🏛️ Стройка ускорена'); })">Изучить</button>${game.techs.architecture?'✅':''}</div>
            <div class="tech-item">🔭 Астрономия (80 н) <button onclick="updateTech('astronomy',80,()=>{ addLog('🔭 Наука +20%'); updateUI(); })">Изучить</button>${game.techs.astronomy?'✅':''}</div>`;
        document.getElementById('techPanel').innerHTML = techHtml;
        
        let achievementsHtml = '';
        for(let [key, val] of Object.entries(game.achievements)) { if(val) { let names = {firstHouse:'🏠 5 домов', firstFarm:'🌾 5 полей', firstMine:'⛏️ 3 шахты', population50:'👥 50 жителей', science100:'🔬 100 науки'}; achievementsHtml += `<div class="achievement">✅ ${names[key]}</div>`; } }
        document.getElementById('achievementsPanel').innerHTML = achievementsHtml || '<div class="achievement">⭐ Нет достижений</div>';
        
        document.getElementById('fullStats').innerHTML = `
            <div class="stat-line">🏰 ${game.name}</div>
            <div class="stat-line">🗺️ Площадь: ${Math.floor(game.landArea)} км²</div>
            <div class="stat-line">🏠 Дома: ${game.houses} (макс.население ${maxPopulation()})</div>
            <div class="stat-line">🌾 Поля: ${game.farms} | ⛏️ Шахт: ${game.mines} | 🔭 Обсерваторий: ${game.observatories}</div>
            <div class="stat-line">🏆 Бонус захвата: +${game.conqueredBonus}%</div>
            <div class="stat-line">📈 Доход/ход: рынок ${game.marketIncome} зол.</div>
            <div class="stat-line">🌲 Лес: ${Math.floor(game.forestDensity)}% | 👶 Рождаемость бонус: +${game.birthBonus.toFixed(1)}</div>
            <div class="stat-line">🍂 Неурожай: ${game.famineCounter>0?"Да":"Нет"} | Ходов: ${game.turn}</div>
            <div class="stat-line">📚 Технологий: ${Object.values(game.techs).filter(v=>v===true).length}/6</div>
            <div class="stat-line">🔬 Наука/ход: ${calcScienceProduction()}</div>
        `;
    }
    
    function initModals() {
        const modals = document.querySelectorAll('.modal');
        const navBtns = document.querySelectorAll('.nav-btn');
        const closeBtns = document.querySelectorAll('.close-modal');
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeAll() { modals.forEach(m => m.style.display = 'none'); }
        navBtns.forEach(btn => { btn.onclick = () => { closeAll(); openModal(btn.dataset.modal); }; });
        closeBtns.forEach(btn => { btn.onclick = () => closeAll(); });
        window.onclick = (e) => { if(e.target.classList.contains('modal')) closeAll(); };
        
        document.getElementById('gatherWoodBtn').onclick = () => { gatherWood(); closeAll(); };
        document.getElementById('gatherStoneBtn').onclick = () => { gatherStone(); closeAll(); };
        document.getElementById('gatherCoalBtn').onclick = () => { gatherCoal(); closeAll(); };
        document.getElementById('buildFarmBtn').onclick = () => { buildFarm(); closeAll(); };
        document.getElementById('buildHouseBtn').onclick = () => { buildHouse(); closeAll(); };
        document.getElementById('buildMineBtn').onclick = () => { buildMine(); closeAll(); };
        document.getElementById('buildObservatoryBtn').onclick = () => { buildObservatory(); closeAll(); };
        document.getElementById('expandLandBtn').onclick = () => { expandLand(); closeAll(); };
        document.getElementById('autoAssignBtn').onclick = () => { autoAssign(); closeAll(); };
        document.getElementById('sellWoodTrade').onclick = () => { sellWoodTrade(); closeAll(); };
        document.getElementById('sellStoneTrade').onclick = () => { sellStoneTrade(); closeAll(); };
        document.getElementById('sellCoalTrade').onclick = () => { sellCoalTrade(); closeAll(); };
        document.getElementById('buyFoodTrade').onclick = () => { buyFoodTrade(); closeAll(); };
        document.getElementById('investTradeBtn').onclick = () => { investTrade(); closeAll(); };
        document.getElementById('upgradeLoggingBtn').onclick = () => { upgradeLogging(); closeAll(); };
        document.getElementById('upgradeMiningBtn').onclick = () => { upgradeMining(); closeAll(); };
        document.getElementById('lawBirthBtn').onclick = () => { lawBirth(); closeAll(); };
        document.getElementById('lawForestBtn').onclick = () => { lawForest(); closeAll(); };
        document.getElementById('lawHarvestBtn').onclick = () => { lawHarvest(); closeAll(); };
        document.getElementById('resetGameBtn').onclick = () => resetGame();
        document.getElementById('saveGameBtn').onclick = () => { saveGame(); closeAll(); };
        document.getElementById('loadGameBtn').onclick = () => { loadGame(); closeAll(); };
        document.getElementById('pauseGameBtn').onclick = () => { gamePaused = !gamePaused; document.getElementById('pauseGameBtn').innerText = gamePaused ? '▶️' : '⏸️'; addLog(gamePaused ? "⏸️ Игра на паузе" : "▶️ Игра продолжена"); };
        
        window.assignWorker = assignWorker;
        window.updateTech = updateTech;
        
        document.getElementById('kingdomNameInput').onchange = () => { game.name = document.getElementById('kingdomNameInput').value; updateUI(); };
    }
    
    updateMaxWorkers();
    game.workers.farmers = Math.min(2, game.maxWorkers.farmers);
    game.workers.lumberjacks = 2;
    game.workers.miners = 0;
    game.workers.scientists = 0;
    initModals();
    gameInterval = setInterval(() => gameTick(), 14000);
    updateUI();
    drawChart();
    addLog("🏆 Начинай с малого: 3 дома, 10 человек, 1 поле. Развивай королевство медленно и мудро!");
</script>
</body>
</html>
