<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Тихая ферма</title>
<style>
:root{--bg:#10231a;--panel:rgba(16,35,26,.82);--gold:#e8b84a;--gold2:#f6d98a;--cream:#f4ead2;--ember:#d65a31;--ink:#1c1409}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:'Trebuchet MS','Segoe UI',sans-serif;touch-action:none;color:var(--cream)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#top{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}
.pill{background:var(--panel);border:1.5px solid var(--gold);border-radius:20px;padding:6px 14px;font-weight:700;font-size:16px;letter-spacing:.3px;box-shadow:0 4px 14px #0006;backdrop-filter:blur(6px)}
#seeds{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 54px);display:flex;gap:6px;justify-content:center;transition:.2s;opacity:0;transform:translateY(-8px);pointer-events:none}
#seeds.on{opacity:1;transform:none;pointer-events:auto}
.sc{background:var(--panel);border:1.5px solid #e8b84a55;border-radius:14px;padding:5px 9px;font-size:14px;font-weight:700;text-align:center;min-width:54px}
.sc.sel{border-color:var(--gold);background:linear-gradient(#3b5a3f,#1d3a27);box-shadow:0 0 0 2px #e8b84a55}
.sc.z{opacity:.45}
#msg{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 100px);text-align:center;font-size:15px;font-weight:700;text-shadow:0 2px 6px #000;pointer-events:none;opacity:0;transition:.25s}
#msg.on{opacity:1}
#jb{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);width:128px;height:128px;margin-left:-64px;border-radius:50%;background:radial-gradient(#10231a99,#10231a55);border:2px solid var(--gold);box-shadow:inset 0 0 18px #0008,0 6px 18px #0006;touch-action:none}
#jk{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold2),#c8922c);border:2px solid #5a3d0e;transform:translate(-50%,-50%);box-shadow:0 3px 8px #0009}
.rb{position:fixed;border-radius:50%;border:2px solid var(--gold);background:var(--panel);color:var(--gold2);font:700 22px 'Trebuchet MS',sans-serif;width:46px;height:46px;box-shadow:0 4px 12px #0007;touch-action:none}
.rb:active{transform:scale(.92)}
#zi{left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 158px)}
#zo{left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 104px)}
#a{right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);width:78px;height:78px;font-size:34px;background:radial-gradient(circle at 35% 30%,var(--gold2),#c8922c);border:3px solid #5a3d0e;color:var(--ink)}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:8px;padding:8px;background:var(--panel);border:1.5px solid var(--gold);border-radius:22px;box-shadow:0 6px 20px #0008;backdrop-filter:blur(6px)}
.t{width:66px;height:56px;border-radius:14px;border:1.5px solid #e8b84a55;background:linear-gradient(#2b4a35,#162d1f);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;line-height:1;transition:.15s}
.t small{font-size:10px;margin-top:3px;color:var(--gold2);font-weight:700}
.t.on{background:linear-gradient(var(--gold2),#d39a2e);border-color:#fff3;transform:translateY(-5px);box-shadow:0 6px 12px #0007}
.t.on small{color:var(--ink)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9}
#modal.on{display:flex}
.card{width:min(440px,100%);background:#152c1f;border:2px solid var(--gold);border-bottom:0;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.card h2{margin:0 0 4px;font:700 22px Georgia,serif;color:var(--gold2)}
.sub{font-size:15px;margin-bottom:10px;opacity:.85}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid #e8b84a33;font-size:16px;font-weight:700}
.row small{display:block;font-weight:400;font-size:12px;opacity:.7}
.card button{font:700 15px 'Trebuchet MS',sans-serif;border-radius:12px;border:1.5px solid var(--gold);background:linear-gradient(#3b5a3f,#1d3a27);color:var(--cream);padding:9px 12px}
.card button.big{width:100%;margin-top:10px;background:linear-gradient(var(--gold2),#d39a2e);color:var(--ink);padding:13px}
.card button:active{transform:scale(.97)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><div class="pill" id="pc"></div><div class="pill" id="pd"></div></div>
<div id="seeds"></div><div id="msg"></div>
<button class="rb" id="zi">+</button><button class="rb" id="zo">−</button>
<div id="jb"><div id="jk"></div></div>
<button class="rb" id="a">⛏️</button>
<div id="bar"></div>
<div id="modal"><div class="card" id="card"></div></div>
<script>
const T=16,W=26,H=22,$=i=>document.getElementById(i),cv=$('c'),ctx=cv.getContext('2d');
const CR=[{n:'Морковь',e:'🥕',t:6,sell:10,cost:5,c:'#f08a24',l:'#46a83a'},{n:'Томат',e:'🍅',t:9,sell:18,cost:9,c:'#e2352b',l:'#3f9a35'},{n:'Кукуруза',e:'🌽',t:12,sell:30,cost:14,c:'#f2cf3a',l:'#6cb43c'},{n:'Тыква',e:'🎃',t:16,sell:48,cost:22,c:'#e8731a',l:'#4d8f2f'}];
const TL=[{e:'⛏️',n:'Мотыга'},{e:'🌱',n:'Сев'},{e:'💧',n:'Лейка'},{e:'🧺',n:'Сбор'}];
let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647,hs=(x,y)=>((x*73856093^y*19349663)>>>0)%100;
const g=[],soil=[],crop=[];
for(let y=0;y<H;y++){g.push([]);soil.push([]);crop.push([]);for(let x=0;x<W;x++){g[y][x]=(x==0||y==0||x==W-1||y==H-1)?1:0;soil[y][x]=0;crop[y][x]=null}}
for(let y=2;y<=5;y++)for(let x=18;x<=22;x++)g[y][x]=2;
for(let y=2;y<=3;y++)for(let x=2;x<=5;x++)g[y][x]=3;
g[3][8]=4;g[3][10]=5;
for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(!g[y][x]&&rnd()<.08&&!(x>=3&&x<=16&&y>=5&&y<=17)&&!(y<=5&&x<=12)&&!(x>=17&&y<=7))g[y][x]=1;
const p={x:9.5*T,y:7*T,dx:0,dy:1,tool:0,cr:0,sd:[5,0,0,0],h:[0,0,0,0],water:8,coins:0,t:0,tm:0};
try{const v=JSON.parse(localStorage.getItem('farm2')||'null');if(v){Object.assign(p,v.p);for(const[y,x,s,c]of v.c){soil[y][x]=s;crop[y][x]=c}}}catch(e){}
function save(){try{const c=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(soil[y][x])c.push([y,x,soil[y][x],crop[y][x]]);localStorage.setItem('farm2',JSON.stringify({p,c}))}catch(e){}}
setInterval(save,5000);
let zoom=1,S=1,VW=0,VH=0,dpr=Math.min(devicePixelRatio||1,3);
const zt=z=>zoom=Math.max(.7,Math.min(2.4,z));
function rs(){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr}addEventListener('resize',rs);rs();
$('zi').onpointerdown=()=>zt(zoom*1.2);$('zo').onpointerdown=()=>zt(zoom/1.2);
addEventListener('wheel',e=>zt(zoom*(e.deltaY<0?1.1:.9)));
// UI
const bar=$('bar');TL.forEach((t,i)=>{const d=document.createElement('div');d.className='t';d.innerHTML=t.e+'<small>'+t.n+'</small>';d.onpointerdown=()=>setTool(i);bar.appendChild(d)});
function setTool(i){p.tool=i;hud();say(TL[i].n)}
let mt=0;function say(s){const m=$('msg');m.textContent=s;m.classList.add('on');mt=2.4}
function hud(){
  [...bar.children].forEach((d,i)=>d.classList.toggle('on',i==p.tool));$('a').textContent=TL[p.tool].e;
  $('pc').textContent='🪙 '+p.coins;
  const s=$('seeds');s.classList.toggle('on',p.tool==1);s.innerHTML='';
  CR.forEach((r,i)=>{const d=document.createElement('div');d.className='sc'+(p.cr==i?' sel':'')+(p.sd[i]?'':' z');d.innerHTML=r.e+'<br>'+p.sd[i];d.onpointerdown=()=>{p.cr=i;hud()};s.appendChild(d)});
}
function clock(){const f=(p.tm/180)%1,h=(6+f*24)%24|0,m=((6+f*24)%1*60|0);$('pd').textContent=(f<.65?'☀️ ':f<.92?'🌙 ':'🌅 ')+h+':'+String(m).padStart(2,'0')+'  💧'+p.water}
function shop(){
  let h='<h2>Лавка фермера</h2><div class="sub">У тебя 🪙 '+p.coins+'</div>';
  CR.forEach((r,i)=>h+='<div class="row"><span>'+r.e+' '+r.n+'<small>растёт ~'+r.t*2+' с · продажа '+r.sell+'🪙</small></span><button data-b="'+i+'">×3 · '+r.cost*3+'🪙</button></div>');
  const tot=p.h.reduce((s,n,i)=>s+n*CR[i].sell,0);
  h+='<div class="row"><span>Урожай<small>'+(CR.map((r,i)=>p.h[i]?r.e+p.h[i]:'').join(' ')||'пока пусто')+'</small></span></div><button class="big" data-s="1">Продать всё за '+tot+'🪙</button><button class="big" data-x="1" style="background:#2b4a35;color:#f4ead2">Закрыть</button>';
  $('card').innerHTML=h;$('modal').classList.add('on');
}
$('card').onclick=e=>{const d=e.target.dataset;if(d.b!=null){const r=CR[d.b];if(p.coins>=r.cost*3){p.coins-=r.cost*3;p.sd[d.b]+=3}shop()}if(d.s){p.coins+=p.h.reduce((s,n,i)=>s+n*CR[i].sell,0);p.h=[0,0,0,0];shop()}if(d.x){$('modal').classList.remove('on')}hud()};
$('modal').onclick=e=>{if(e.target==$('modal'))$('modal').classList.remove('on')};
// эффекты
const pf=[],ft=[];
function puff(tx,ty,c,n=8){for(let i=0;i<n;i++)pf.push({x:tx*T+8,y:ty*T+8,vx:(rnd()-.5)*40,vy:-rnd()*40,l:.6,c})}
function pop(tx,ty,s){ft.push({x:tx*T+8,y:ty*T+2,s,l:1.2})}
// действия
function act(tx,ty){
  if(tx<0||ty<0||tx>=W||ty>=H)return;
  p.dx=Math.sign(tx*T+8-p.x)*(Math.abs(tx*T+8-p.x)>Math.abs(ty*T+8-p.y));p.dy=p.dx?0:Math.sign(ty*T+8-p.y)||1;
  const k=g[ty][tx];
  if(k==2){p.water=8;puff(tx,ty,'#8cc8f0');pop(tx,ty,'💧 полная');return hud()}
  if(k==4||k==5)return shop();
  if(k)return;
  const c=crop[ty][tx],s=soil[ty][tx];
  if(p.tool==0){if(!s){soil[ty][tx]=1;puff(tx,ty,'#8a5a33')}else say('Тут уже грядка')}
  else if(p.tool==1){if(!s)say('Сначала вскопай землю');else if(c)say('Уже посажено');else if(!p.sd[p.cr])say('Нет семян — загляни в лавку');else{crop[ty][tx]={k:p.cr,s:0,t:0};p.sd[p.cr]--;puff(tx,ty,'#a8d85a',5)}}
  else if(p.tool==2){if(!s)say('Поливать нечего');else if(!p.water)say('Лейка пуста — набери воды в пруду');else if(s==2)say('Уже мокро');else{soil[ty][tx]=2;p.water--;puff(tx,ty,'#8cc8f0',6)}}
  else{if(c&&c.s==2){crop[ty][tx]=null;soil[ty][tx]=1;p.h[c.k]++;puff(tx,ty,CR[c.k].c,10);pop(tx,ty,'+'+CR[c.k].e)}else if(c)say('Ещё растёт')}
  hud();
}
let goal=null,stuck=0;
function tap(px,py){const tx=Math.floor((px/S+cx)/T),ty=Math.floor((py/S+cy)/T);if(tx>=0&&ty>=0&&tx<W&&ty<H)goal={tx,ty}}
$('a').onpointerdown=e=>{e.preventDefault();const[tx,ty]=front();act(tx,ty)};
const front=()=>[Math.floor((p.x+p.dx*11)/T),Math.floor((p.y+p.dy*11)/T)];
// ввод
const jb=$('jb'),jk=$('jk');let jv={x:0,y:0},jid=null;
function jm(e){const r=jb.getBoundingClientRect(),R=r.width/2;let dx=e.clientX-(r.left+R),dy=e.clientY-(r.top+R);const m=Math.hypot(dx,dy);if(m>R){dx*=R/m;dy*=R/m}jv={x:dx/R,y:dy/R};jk.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px))';goal=null}
jb.addEventListener('pointerdown',e=>{jid=e.pointerId;jb.setPointerCapture(jid);jm(e)});
jb.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});
const je=e=>{if(e.pointerId===jid){jid=null;jv={x:0,y:0};jk.style.transform='translate(-50%,-50%)'}};
jb.addEventListener('pointerup',je);jb.addEventListener('pointercancel',je);
const ptr=new Map();let tapS=null,pd0=1;const d2=()=>{const[a,b]=[...ptr.values()];return Math.hypot(a.x-b.x,a.y-b.y)||1};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size==1)tapS={x:e.clientX,y:e.clientY,t:performance.now()};else{tapS=null;pd0=d2()}};
cv.onpointermove=e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size==2){const d=d2();zt(zoom*d/pd0);pd0=d}};
cv.onpointerup=e=>{if(tapS&&ptr.size==1&&Math.hypot(e.clientX-tapS.x,e.clientY-tapS.y)<10&&performance.now()-tapS.t<400)tap(e.clientX,e.clientY);ptr.delete(e.pointerId);tapS=null};
cv.onpointercancel=e=>{ptr.delete(e.pointerId);tapS=null};
const K={};addEventListener('keydown',e=>{K[e.key]=1;if(e.key==' '){const[a,b]=front();act(a,b)}if(e.key>='1'&&e.key<='4')setTool(e.key-1)});addEventListener('keyup',e=>K[e.key]=0);
const solid=(x,y)=>x<0||y<0||x>=W||y>=H||g[y|0][x|0]!=0;
function free(x,y){for(const a of[-4,4])for(const b of[-3,4])if(solid(Math.floor((x+a)/T),Math.floor((y+b)/T)))return false;return true}
// рисование
const R=(c,x,y,w,h)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
function tile(x,y,t){
  const X=x*T,Y=y*T,h=hs(x,y),k=g[y][x];
  R((x+y)%2?'#5fa64a':'#5ba046',X,Y,T,T);
  if(h%4==0){R('#4b8c3b',X+3,Y+10,1,3);R('#4b8c3b',X+4,Y+11,1,2)}
  if(h%6==1)R('#7cc65f',X+10,Y+4,1,3);
  if(h==13||h==62){R('#fff',X+8,Y+7,2,2);R('#f5d142',X+9,Y+8,1,1)}if(h==40){R('#f08ac0',X+4,Y+5,2,2);R('#fff',X+5,Y+6,1,1)}
  if(k==1){R('#0003',X+1,Y+11,15,4);R('#5b3a1f',X+6,Y+8,4,7);R('#3f2814',X+9,Y+8,1,7);R('#2a6b2c',X,Y+1,16,9);R('#348a35',X+2,Y,12,8);R('#4cae44',X+4,Y+1,6,4);R('#7fd05f',X+5,Y+2,2,1);R('#1f5222',X+1,Y+8,14,2)}
  else if(k==2){R('#2f7fc4',X,Y,T,T);R('#3d93d8',X+2,Y+3,12,3);const w=(t*3+x*2)%8;R('#9bd3f5',X+w,Y+5,4,1);R('#9bd3f5',X+(w+6)%12,Y+11,3,1);
    const e=(n,a,b,c,d)=>{if(g[y+n]&&g[y+n][x+(a)]!=2||0)R('#e6d29a',b,c,d[0],d[1])};
    if(g[y-1][x]!=2)R('#e6d29a',X,Y,T,2);if(g[y+1][x]!=2)R('#e6d29a',X,Y+14,T,2);if(g[y][x-1]!=2)R('#e6d29a',X,Y,2,T);if(g[y][x+1]!=2)R('#e6d29a',X+14,Y,2,T)}
  else if(k==3){
    if(y==2){R('#b5452e',X,Y,T,T);R('#cf5a3c',X,Y+2,T,2);R('#cf5a3c',X,Y+8,T,2);R('#8e3322',X,Y+5,T,1);R('#8e3322',X,Y+11,T,1);R('#6e2418',X,Y+14,T,2);if(x==2||x==5)R('#6e2418',x==2?X:X+15,Y,1,T);if(x==4){R('#6b6b6b',X+6,Y-4,5,6);R('#444',X+6,Y-4,5,1)}}
    else{R('#e8d4a8',X,Y,T,T);R('#d4bd8c',X,Y+5,T,1);R('#d4bd8c',X,Y+11,T,1);if(x==3){R('#6b4423',X+3,Y+2,10,14);R('#855731',X+4,Y+3,8,13);R('#f2c14a',X+10,Y+9,2,2)}if(x==4){R('#5a3a1f',X+2,Y+3,12,9);R('#9fd3ee',X+3,Y+4,10,7);R('#5a3a1f',X+7,Y+4,1,7);R('#5a3a1f',X+3,Y+7,10,1);R('#fff6',X+4,Y+5,3,2)}}
  }
  else if(k==4||k==5){const a=k==4?['#3f9a4a','#f4ead2','🌱']:['#c9472b','#f4ead2','💰'];
    R('#0003',X,Y+13,T,3);R('#7a4e24',X+1,Y+8,14,7);R('#9a6a34',X+1,Y+8,14,2);R('#5a3a1f',X+1,Y+4,1,10);R('#5a3a1f',X+14,Y+4,1,10);
    for(let i=0;i<4;i++)R(i%2?a[1]:a[0],X+i*4,Y+1,4,5);R('#0003',X,Y+6,T,1);ctx.font='8px serif';ctx.textAlign='center';ctx.fillText(a[2],X+8,Y+14)}
  else if(soil[y][x]){const w=soil[y][x]==2;R(w?'#3a2412':'#5e3b1f',X,Y,T,T);R(w?'#563520':'#8a5a33',X+1,Y+1,T-2,T-3);for(let i=0;i<3;i++)R(w?'#3f2814':'#74482a',X+2,Y+3+i*4,12,1);R(w?'#6b4428':'#a06c3c',X+2,Y+2,12,1)}
  const c=crop[y][x];if(c&&soil[y][x]){const r=CR[c.k];
    if(c.s==0){R('#d9c28a',X+6,Y+9,1,1);R('#d9c28a',X+9,Y+8,1,1);R(r.l,X+7,Y+6,2,3)}
    else if(c.s==1){R(r.l,X+7,Y+5,2,7);R('#6fd04e',X+4,Y+5,3,2);R('#6fd04e',X+9,Y+7,3,2);R('#3b8a2e',X+5,Y+6,1,1)}
    else{if(c.k==0){R(r.l,X+5,Y+2,2,5);R(r.l,X+9,Y+2,2,5);R(r.l,X+7,Y+1,2,6);R(r.c,X+5,Y+7,6,3);R('#ffb25a',X+6,Y+7,2,1);R(r.c,X+6,Y+10,4,2)}
      else if(c.k==1){R(r.l,X+3,Y+3,10,9);R('#2f7a28',X+3,Y+10,10,2);R(r.c,X+4,Y+5,3,3);R(r.c,X+9,Y+7,3,3);R(r.c,X+6,Y+9,3,3);R('#fff8',X+4,Y+5,1,1)}
      else if(c.k==2){R(r.l,X+7,Y+1,2,13);R('#4e9a30',X+3,Y+4,4,2);R('#4e9a30',X+9,Y+8,4,2);R(r.c,X+9,Y+4,3,5);R('#c9a21e',X+11,Y+4,1,5);R('#4e9a30',X+9,Y+3,3,1)}
      else{R('#2f6b1f',X+7,Y+4,2,3);R(r.l,X+9,Y+5,3,2);R(r.c,X+2,Y+7,12,7);R('#c25a10',X+6,Y+7,1,7);R('#c25a10',X+10,Y+7,1,7);R('#ffa14a',X+3,Y+8,2,2)}
      if(((t*2|0)+x+y)%5==0)R('#fff',X+12,Y+2,1,1)}
    if(c.s<2&&soil[y][x]==1){const b=Math.sin(t*4)>0?0:1;R('#6bc3ff',X+7,Y+1+b,2,2);R('#6bc3ff',X+7.5,Y+b,1,1)}}
}
